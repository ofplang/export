name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The example documents the golden test reads live in the pinned
          # submodule (design.md D20).
          submodules: true

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run typecheck
        working-directory: web

      - run: npm test
        working-directory: web

      # The Pages build, then the same build folded into one file: the viewer
      # template the Python CLI carries (design.md D48). Kept for every run
      # so any commit's template can be picked up.
      - run: npm run build:single
        working-directory: web

      - uses: actions/upload-artifact@v4
        with:
          name: viewer-template
          path: web/dist-single/viewer.html
          retention-days: 90

  python:
    # The `ofp-export` command (design.md D49, D50). The template it embeds into
    # is built from web/ first, so the wheel check below sees the real one.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # setuptools-scm derives the version from tags + history.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: npm ci && npm run build:single
        working-directory: web

      - run: python -m pip install -e ".[dev]"

      - run: python -m pytest

      - name: Lint and types
        if: matrix.python-version == '3.12'
        run: |
          python -m ruff check ofplang tests
          python -m ruff format --check ofplang tests
          python -m mypy

      # The template is built, not committed, so it reaches the wheel only
      # through MANIFEST.in and package-data. Check that it did, and that the
      # installed command finds it.
      - name: The wheel carries the template
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build
          python -m build
          python -m zipfile -l dist/*.whl | grep -q "ofplang/export/_template/viewer.html"
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl
          /tmp/w/bin/ofp-export view external/ofplang-schedule/examples/reformatter.workflow.yaml -o /tmp/w.html
          grep -q 'id="ofp-documents"' /tmp/w.html

  browser:
    # Layout is the one thing the unit tests cannot see (dev-notes D26).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # One browser test opens a file the Python command wrote.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install PyYAML

      - run: npm ci
        working-directory: web

      - run: npx playwright install --with-deps chromium --only-shell
        working-directory: web

      - run: npm run test:e2e
        working-directory: web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  pages:
    # D1 only actually holds once there is a URL to hand someone. Gated on both
    # other jobs, so a broken chart never becomes the published one.
    needs: [check, browser, python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # `base: "./"` in the Vite config is what lets the same build work from a
      # project sub-path, a user site and a plain file:// open alike.
      - run: npm run build
        working-directory: web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deploy
        uses: actions/deploy-pages@v4
