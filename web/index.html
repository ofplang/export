<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OFP View</title>
    <meta
      name="description"
      content="Read an ofplang workflow and the plans ofp-schedule makes from it, linked: what runs where, and when."
    />
    <!-- The ofplang mark (ofplang/spec, logos/). SVG inline, so a single-file
         viewer needs nothing beside it; the PNG is for browsers that will not
         take an SVG icon, and is dropped from the single file. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Ccircle cx='256' cy='256' r='252' fill='%23A81F24'/%3E%3Cg transform='translate(35.6 86.6) scale(2.5)' fill='none' stroke='%23fff' stroke-width='9' stroke-linecap='round'%3E%3Cpath d='M74 54 A32 32 0 1 0 76 73 H90'/%3E%3Cpath d='M118 73 H148'/%3E%3Cpath d='M104 123 V29 Q104 19 114 19 H148'/%3E%3C/g%3E%3Cg transform='translate(35.6 86.6) scale(2.5)' fill='%23fff'%3E%3Ccircle cx='148' cy='73' r='11'/%3E%3Ccircle cx='148' cy='19' r='11'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="icon" type="image/png" href="favicon.png" data-site-only />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="app">
      <div class="rail">
        <div class="wordmark" title="OFP View — a viewer for Object-Flow Programming Language documents"><svg class="mark" viewBox="0 0 512 512" width="18" height="18" aria-hidden="true"><circle cx="256" cy="256" r="252" fill="#A81F24"/><g transform="translate(35.6 86.6) scale(2.5)" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"><path d="M74 54 A32 32 0 1 0 76 73 H90"/><path d="M118 73 H148"/><path d="M104 123 V29 Q104 19 114 19 H148"/></g><g transform="translate(35.6 86.6) scale(2.5)" fill="#fff"><circle cx="148" cy="73" r="11"/><circle cx="148" cy="19" r="11"/></g></svg><b>OFP View</b></div>

        <label class="lg" for="dataset">Plan</label>
        <select id="dataset" aria-label="Plan"></select>

        <div class="seg" id="layouts" role="group" aria-label="Panes"></div>
        <button id="details" aria-pressed="true" title="Show or hide the details of what is selected">Details</button>
        <button id="share">Copy link</button>

        <div class="readouts">
          <div class="readout"><span class="k">Outcome</span><span class="v" id="ro-outcome">—</span></div>
          <div class="readout"><span class="k">Makespan</span><span class="v num" id="ro-makespan">—</span></div>
          <div class="readout"><span class="k">Activities</span><span class="v num" id="ro-count">—</span></div>
          <select id="theme" aria-label="Theme">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </div>

      <main>
        <div class="stack" id="stack">
        <section class="pane" id="graph-pane">
          <div class="pane-hd">
            <h2>Workflow</h2>
            <span class="hint" id="graph-hint"></span>
            <span class="spacer"></span>
            <button id="expand-all">Expand all</button>
            <button id="collapse-all">Collapse</button>
            <div class="seg" role="group" aria-label="Graph zoom">
              <button id="graph-out" aria-label="Zoom out">&minus;</button>
              <button id="graph-fit">Fit</button>
              <button id="graph-in" aria-label="Zoom in">+</button>
            </div>
          </div>
          <div class="graph-scroll" id="graph-scroll"><svg id="graph"></svg></div>
        </section>

        <div
          class="splitter"
          id="splitter"
          role="separator"
          aria-orientation="horizontal"
          aria-label="Resize the panes"
          tabindex="0"
        ></div>

        <section class="pane" id="plan-pane">
          <div class="pane-hd">
            <h2>Execution plan</h2>
            <div class="seg" id="views" role="group" aria-label="View"></div>
            <select id="job" aria-label="Job" title="One job of the plan alone, or all of them" hidden></select>
            <div class="legend" id="legend"></div>
            <span class="spacer"></span>
            <button id="labels" aria-pressed="true">Labels</button>
            <div class="seg" role="group" aria-label="Time zoom">
              <button id="zoom-out" aria-label="Zoom out">&minus;</button>
              <button id="zoom-fit">Fit</button>
              <button id="zoom-in" aria-label="Zoom in">+</button>
            </div>
            <button id="export">Export SVG</button>
          </div>

          <div class="banner" id="banner" hidden></div>

          <div class="pane-empty" id="plan-empty" hidden>
            <b id="plan-empty-title">No plan loaded.</b>
            <span id="plan-empty-why"
              >This workflow has not been scheduled yet. Run
              <code>ofp-schedule schedule</code> on it and drop the plan here to see when
              each step runs.</span
            >
          </div>

          <div class="chart" id="chart">
            <div class="axis-row">
              <div class="axis-gutter"></div>
              <div class="axis-scroll" id="axis-scroll"><svg id="axis"></svg></div>
            </div>
            <div class="body-row" id="body-row">
              <svg class="gut" id="gutter"></svg>
              <div class="plot-wrap"><svg id="plot"></svg></div>
            </div>
          </div>
        </section>
        </div>

        <aside><div class="insp" id="inspector"></div></aside>
      </main>

      <div class="status">
        <span id="status-selection">Nothing selected</span>
        <span class="spacer"></span>
        <span class="mono" id="status-source"></span>
      </div>
    </div>

    <div id="tip"></div>
    <div id="drop">Drop a plan, a workflow or an environment YAML</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
